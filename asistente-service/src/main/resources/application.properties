spring.application.name=asistente-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:deploy}

spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.serialization.write-dates-as-timestamps=false

asistente.rag.top-k=3
asistente.rag.score-minimo=0.65
asistente.rag.score-alto=0.80
asistente.rag.hilos=2
asistente.rag.cola=50
asistente.rag.timeout-segundos=5

asistente.llm.api-key=${LLM_API_KEY:}
asistente.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
asistente.llm.model=${LLM_MODEL:gpt-4o-mini}
asistente.llm.timeout-segundos=20
asistente.llm.hilos=4
asistente.llm.cola=20

resilience4j.circuitbreaker.instances.llm.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.llm.sliding-window-size=10
resilience4j.circuitbreaker.instances.llm.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.llm.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llm.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.llm.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.llm.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.llm.register-health-indicator=true
resilience4j.circuitbreaker.instances.llm.allow-health-indicator-to-fail=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true

asistente.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
asistente.kafka.topic=triaje.eventos
asistente.kafka.topic-dlt=triaje.eventos.dlt
asistente.kafka.grupo=asistente-urgencias
asistente.kafka.max-poll-records=100
asistente.kafka.consumidor-habilitado=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

asistente.seguridad.api-key=${ASISTENTE_API_KEY:}

spring.reactor.context-propagation=auto
management.tracing.enabled=${TRACING_ENABLED:false}
management.otlp.tracing.export.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_ENDPOINT:http://localhost:4318/v1/traces}

asistente.validacion.cobertura-minima=0.85
