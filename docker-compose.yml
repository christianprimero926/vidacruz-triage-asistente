name: vidacruz

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: ${DB_USER:-triage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-triage-local-pass}
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d triage"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    # retention.ms=-1: el topic es la fuente para reconstruir el estado de Redis
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic triaje.eventos --partitions 3 --replication-factor 1 --config retention.ms=-1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic triaje.eventos.dlt --partitions 1 --replication-factor 1

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  webhook-echo:
    image: mendhak/http-https-echo:latest
    environment:
      HTTP_PORT: 8080
      HTTPS_PORT: 8443
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  triage-service:
    build: ./triage-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      webhook-echo:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: triage
      DB_USER: ${DB_USER:-triage}
      DB_PASSWORD: ${DB_PASSWORD:-triage-local-pass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRIAGE_API_KEY: ${TRIAGE_API_KEY:-triage-local-key}
      # Los probes de actuator solo se activan solos dentro de Kubernetes
      WEBHOOK_ALERTAS_URL: ${WEBHOOK_ALERTAS_URL:-http://webhook-echo:8080/alertas}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      OTEL_ENDPOINT: http://jaeger:4318/v1/traces
      TRIAGE_SLA_CRITICO_MINUTOS: ${TRIAGE_SLA_CRITICO_MINUTOS:-5}
      TRIAGE_SLA_URGENTE_MINUTOS: ${TRIAGE_SLA_URGENTE_MINUTOS:-10}
      TRIAGE_SLA_URGENTE2_MINUTOS: ${TRIAGE_SLA_URGENTE2_MINUTOS:-30}
      TRIAGE_SLA_NO_URGENTE_MINUTOS: ${TRIAGE_SLA_NO_URGENTE_MINUTOS:-60}
      TRIAGE_SLA_NO_URGENTE2_MINUTOS: ${TRIAGE_SLA_NO_URGENTE2_MINUTOS:-120}
      TRIAGE_JOBS_SLA_INTERVALO_MS: ${TRIAGE_JOBS_SLA_INTERVALO_MS:-15000}
    ports:
      - "8081:8080"

  asistente-service:
    build: ./asistente-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      ASISTENTE_API_KEY: ${ASISTENTE_API_KEY:-asistente-local-key}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      OTEL_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8082:8080"

volumes:
  postgres-data:
  kafka-data:
  redis-data:
