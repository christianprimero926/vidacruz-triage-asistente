apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: crear-topics
          image: apache/kafka:3.8.0
          command: ["/bin/sh", "-c"]
          # retention.ms=-1: el topic es la fuente para reconstruir el estado de Redis
          args:
            - |
              set -e
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1; do
                echo "Esperando a Kafka"; sleep 3
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                --topic triaje.eventos --partitions 3 --replication-factor 1 --config retention.ms=-1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                --topic triaje.eventos.dlt --partitions 1 --replication-factor 1
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
