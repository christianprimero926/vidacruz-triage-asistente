# Ejemplo de la forma del secret. No contiene valores reales y no entra en kustomization.yaml:
# deploy.sh crea el real con `kubectl create secret generic vidacruz-secrets --from-literal=...`
apiVersion: v1
kind: Secret
metadata:
  name: vidacruz-secrets
  namespace: vidacruz
type: Opaque
stringData:
  DB_PASSWORD: "<contrasena-de-base-de-datos>"
  TRIAGE_API_KEY: "<api-key-de-triage>"
  ASISTENTE_API_KEY: "<api-key-del-asistente>"
  LLM_API_KEY: ""
  WEBHOOK_ALERTAS_URL: "http://webhook-echo:8080/alertas"
