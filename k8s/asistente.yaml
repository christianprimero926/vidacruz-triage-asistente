apiVersion: v1
kind: Service
metadata:
  name: asistente-service
spec:
  selector:
    app: asistente-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asistente-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asistente-service
  template:
    metadata:
      labels:
        app: asistente-service
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: asistente-service
          image: asistente-service
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: vidacruz-config
            - secretRef:
                name: vidacruz-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # ONNX Runtime extrae su librería nativa en /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
