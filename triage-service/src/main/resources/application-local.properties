server.port=8081

# La contraseña llega por variable de entorno
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triage}
spring.r2dbc.username=${DB_USER:triage}
spring.r2dbc.password=${DB_PASSWORD}

spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triage}
spring.flyway.user=${DB_USER:triage}
spring.flyway.password=${DB_PASSWORD}
