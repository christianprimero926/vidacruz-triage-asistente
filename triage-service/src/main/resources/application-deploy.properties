server.port=8080

spring.r2dbc.url=r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:triage}
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${DB_PASSWORD}

spring.flyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:triage}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}

triage.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

logging.structured.format.console=ecs
logging.structured.ecs.service.name=triage-service
