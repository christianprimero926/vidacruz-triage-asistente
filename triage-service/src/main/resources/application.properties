spring.application.name=triage-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:deploy}

spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.serialization.write-dates-as-timestamps=false

# SLA en minutos por nivel (RN-02)
triage.sla.critico-minutos=5
triage.sla.urgente-minutos=10
triage.sla.urgente2-minutos=30
triage.sla.no-urgente-minutos=60
triage.sla.no-urgente2-minutos=120

# Alertas al equipo médico: la URL del webhook llega por variable de entorno
triage.alertas.webhook-url=${WEBHOOK_ALERTAS_URL:}
triage.alertas.timeout-ms=3000
triage.alertas.max-intentos=5
triage.alertas.espera-base-ms=30000
triage.jobs.alertas-intervalo-ms=2000
triage.jobs.alertas-lote=20

# Rango máximo que admite el reporte de operación
triage.reporte.rango-maximo-dias=31

# Publicación del outbox a Kafka
triage.jobs.enabled=true
triage.jobs.outbox-intervalo-ms=500
triage.jobs.outbox-lote=100
triage.outbox.max-intentos=5
# Tope de una corrida de cualquier job; si se cuelga se cancela y sigue el siguiente tick
triage.jobs.timeout-corrida-ms=60000

# Monitor de SLA: cada cuánto evalúa y cuántos pacientes vencidos procesa por corrida
triage.jobs.sla-intervalo-ms=15000
triage.jobs.sla-lote=100
triage.kafka.topic=triaje.eventos

# Seguridad: sin TRIAGE_API_KEY la aplicación no arranca
triage.security.api-key=${TRIAGE_API_KEY:}

# La correlación del contexto de Reactor llega al MDC
spring.reactor.context-propagation=auto
logging.pattern.level=%5p [%X{correlationId:-}]

# Actuator: health, probes y métricas de Prometheus (las rutas, salvo health, exigen API key)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,r2dbc

# Trazas OpenTelemetry: sin TRACING_ENABLED no se crean ni se exportan
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=${TRACING_ENABLED:false}
management.otlp.tracing.endpoint=${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
