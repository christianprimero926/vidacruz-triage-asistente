spring.main.banner-mode=off
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
logging.level.org.flywaydb=WARN

# Los tests ejecutan el job a mano para controlar cuándo se publica
triage.jobs.enabled=false

triage.security.api-key=clave-de-pruebas
management.endpoint.health.show-components=always
management.tracing.enabled=false

# El logging de Logback se inicializa una sola vez por JVM: todas las pruebas usan el formato de producción
logging.structured.format.console=ecs
logging.structured.ecs.service.name=triage-service
